name: migration-tracker
description: Fail pull requests that add new imports of deprecated packages listed in migrations.json.
author: migration-tracker contributors
branding:
  icon: trending-down
  color: orange

inputs:
  working-directory:
    description: Directory that contains migrations.json and .migrations/baseline.json.
    required: false
    default: .
  base-ref:
    description: >-
      Git ref or SHA to compare the baseline against (passed to `migration-tracker check --base`).
      Fetched automatically if it is missing from a shallow checkout.
      When empty (for example on push events), baseline verification is skipped.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  args:
    description: Extra arguments appended to `migration-tracker check`, split on whitespace.
    required: false
    default: ""
  report-path:
    description: >-
      When set, also write the HTML dashboard to this path (relative to working-directory)
      with `migration-tracker report --format html`. Runs even when the check fails.
    required: false
    default: ""
  report-args:
    description: >-
      Extra arguments appended to `migration-tracker report`, split on whitespace.
      Only used when report-path is set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build migration-tracker
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        npx --yes pnpm@12.6.0 install --frozen-lockfile
        npx --yes pnpm@12.6.0 build
    - name: migration-tracker check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MIGRATION_TRACKER_BIN: ${{ github.action_path }}/packages/cli/dist/bin.js
        MIGRATION_TRACKER_BASE_REF: ${{ inputs.base-ref }}
        MIGRATION_TRACKER_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        cmd=(node "$MIGRATION_TRACKER_BIN" check --format github)
        if [ -n "$MIGRATION_TRACKER_BASE_REF" ]; then
          if ! git cat-file -e "$MIGRATION_TRACKER_BASE_REF^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$MIGRATION_TRACKER_BASE_REF"
          fi
          cmd+=(--base "$MIGRATION_TRACKER_BASE_REF")
        else
          echo "::notice title=migration-tracker::No base-ref given; skipping baseline verification."
        fi
        extra=()
        if [ -n "$MIGRATION_TRACKER_ARGS" ]; then
          read -r -a extra <<< "$MIGRATION_TRACKER_ARGS"
        fi
        "${cmd[@]}" ${extra[@]+"${extra[@]}"}
    - name: migration-tracker report
      if: ${{ always() && inputs.report-path != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MIGRATION_TRACKER_BIN: ${{ github.action_path }}/packages/cli/dist/bin.js
        MIGRATION_TRACKER_REPORT_PATH: ${{ inputs.report-path }}
        MIGRATION_TRACKER_REPORT_ARGS: ${{ inputs.report-args }}
      run: |
        set -euo pipefail
        extra=()
        if [ -n "$MIGRATION_TRACKER_REPORT_ARGS" ]; then
          read -r -a extra <<< "$MIGRATION_TRACKER_REPORT_ARGS"
        fi
        node "$MIGRATION_TRACKER_BIN" report --format html --output "$MIGRATION_TRACKER_REPORT_PATH" ${extra[@]+"${extra[@]}"}
